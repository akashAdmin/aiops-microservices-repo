name: Boutique CI Pipeline
# This workflow builds and pushes Docker images for the boutique microservices and updates the Kubernetes manifests with the new image tags.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'gitops/**'

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - auth
          - gateway
          - orders
          - order-service
          - product-service
          - user-service
          - frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Login to Docker Hub
        uses: docker/login-action@v3.3.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          if [ "${{ matrix.service }}" == "frontend" ]; then
            BUILD_PATH="projects/boutique-microservices/frontend"
          else
            BUILD_PATH="projects/boutique-microservices/backend/services/${{ matrix.service }}"
          fi
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/boutique-${{ matrix.service }}:$IMAGE_TAG \
            $BUILD_PATH

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/boutique-${{ matrix.service }}:$IMAGE_TAG

  update-manifests:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure Git Credentials
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout main || git checkout -b main

      - name: Update image tags in k8s manifests
        run: |
          set -euo pipefail
          NEW_TAG=${{ github.sha }}
          DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
          for SERVICE in auth gateway orders order-service product-service user-service; do
            MANIFEST="gitops/k8s/backend/${SERVICE}.yml"
            test -f "$MANIFEST"
            sed -i "s|image: ${DOCKERHUB_USERNAME}/boutique-${SERVICE}:.*|image: ${DOCKERHUB_USERNAME}/boutique-${SERVICE}:${NEW_TAG}|" "$MANIFEST"
            grep -qF "image: ${DOCKERHUB_USERNAME}/boutique-${SERVICE}:${NEW_TAG}" "$MANIFEST"
          done
          FRONTEND_MANIFEST="gitops/k8s/frontend/deployment.yml"
          test -f "$FRONTEND_MANIFEST"
          sed -i "s|image: ${DOCKERHUB_USERNAME}/boutique-frontend:.*|image: ${DOCKERHUB_USERNAME}/boutique-frontend:${NEW_TAG}|" "$FRONTEND_MANIFEST"
          grep -qF "image: ${DOCKERHUB_USERNAME}/boutique-frontend:${NEW_TAG}" "$FRONTEND_MANIFEST"

      - name: Commit and push updated manifests
        run: |
          git add gitops/k8s/
          if ! git diff --staged --quiet; then
            git commit -m "ci: update image tags to ${{ github.sha }}"
          fi
          git push origin main
