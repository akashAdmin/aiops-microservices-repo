name: Boutique CI Pipeline

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - auth
          - gateway
          - orders
          - order-service
          - product-service
          - user-service
          - frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          if [ "${{ matrix.service }}" == "frontend" ]; then
            BUILD_PATH="projects/boutique-microservices/frontend"
          else
            BUILD_PATH="projects/boutique-microservices/backend/services/${{ matrix.service }}"
          fi
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/boutique-${{ matrix.service }}:$IMAGE_TAG \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/boutique-${{ matrix.service }}:latest \
            $BUILD_PATH

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/boutique-${{ matrix.service }}:$IMAGE_TAG
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/boutique-${{ matrix.service }}:latest

  update-manifests:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update image tags in k8s manifests
        run: |
          NEW_TAG=${{ github.sha }}
          DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
          for SERVICE in auth gateway orders order-service product-service user-service; do
            MANIFEST="gitops/k8s/backend/${SERVICE}.yml"
            sed -i "s|${DOCKERHUB_USERNAME}/boutique-${SERVICE}:.*|${DOCKERHUB_USERNAME}/boutique-${SERVICE}:${NEW_TAG}|g" $MANIFEST
          done
          sed -i "s|${DOCKERHUB_USERNAME}/boutique-frontend:.*|${DOCKERHUB_USERNAME}/boutique-frontend:${NEW_TAG}|g" gitops/k8s/frontend/deployment.yml

      - name: Commit and push updated manifests
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add gitops/k8s/
          git diff --staged --quiet || git commit -m "ci: update image tags to ${{ github.sha }}"
          git push